name: Build & Deploy Musly Android

on:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_android.yml'
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (requis pour Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (ARM64 pour optimiser la taille sous les 100 Mo de Cloudflare)
        run: flutter build apk --release --target-platform android-arm64

      - name: Check APK file
        run: |
          ls -lh build/app/outputs/flutter-apk/
          APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -n 1)
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
        id: apk_info

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          NAME=$(echo $VERSION | cut -d'+' -f1)
          BUILD=$(echo $VERSION | cut -d'+' -f2)
          echo "version_name=$NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD" >> $GITHUB_OUTPUT

      - name: Deploy APK to music.corentinjanin.fr
        run: |
          curl --fail -sS -X POST "https://music.corentinjanin.fr/api/musly/deploy" \
            -H "X-Musly-Auth: ${{ secrets.X_MUSLY_AUTH }}" \
            -F "file=@${{ steps.apk_info.outputs.apk_path }}" \
            -F "version=${{ steps.version.outputs.version_name }}" \
            -F "build_number=${{ steps.version.outputs.build_number }}" \
            -F 'release_notes=["Ameliorations Android Auto: actualisation dynamique de la pochette, navigation et swipe dans la file d attente, recherche et commandes vocales enrichies"]'
