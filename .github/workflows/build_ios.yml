name: Build & Deploy Musly iOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 2.10.16, leave empty to read from pubspec.yaml)'
        required: false
        type: string
  push:
    branches:
      - master
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_ios.yml'

jobs:
  build_ipa:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Register Swift files and MuslyTunnel target in Xcode project
        run: |
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project_path = "ios/Runner.xcodeproj"
            project = Xcodeproj::Project.open(project_path)
            runner_target = project.targets.find { |t| t.name == "Runner" }
            runner_group = project.main_group.find_subpath("Runner", true)

            # 1. Enregistrer UpdateBridge.swift dans Runner
            unless runner_group.files.any? { |f| f.path == "UpdateBridge.swift" }
              file_ref = runner_group.new_file("UpdateBridge.swift")
              runner_target.add_file_references([file_ref])
            end

            # 2. Enregistrer la cible MuslyTunnel si inexistante
            unless project.targets.any? { |t| t.name == "MuslyTunnel" }
              tunnel_target = project.new_target(:app_extension, "MuslyTunnel", :ios, "15.0")
              tunnel_group = project.main_group.find_subpath("MuslyTunnel", true)
              tunnel_group.set_source_tree("<group>")
              tunnel_group.set_path("MuslyTunnel")
              ptp_ref = tunnel_group.new_file("PacketTunnelProvider.swift")
              tunnel_target.add_file_references([ptp_ref])

              tunnel_target.build_configurations.each do |config|
                config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "fr.corentinjanin.musly.MuslyTunnel"
                config.build_settings["INFOPLIST_FILE"] = "MuslyTunnel/Info.plist"
                config.build_settings["SWIFT_VERSION"] = "5.0"
                config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.0"
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              end

              embed_phase = runner_target.new_copy_files_build_phase("Embed App Extensions")
              embed_phase.symbol_dst_subfolder_spec = :plug_ins
              embed_phase.add_file_reference(tunnel_target.product_reference)
              runner_target.add_dependency(tunnel_target)
            end

            project.save
          '

      - name: Install CocoaPods
        run: |
          cd ios && pod install --repo-update

      - name: Boot Apple iPhone Simulator & Validate Environment
        run: |
          echo "Initialisation du simulateur iPhone officiel sur le runner Mac..."
          xcrun simctl list devices available
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone (15|16|14)" | head -1 | grep -o -E "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" || true)
          if [ -n "$SIM_ID" ]; then
            echo "Démarrage du simulateur Apple ID: $SIM_ID"
            xcrun simctl boot "$SIM_ID" || true
            xcrun simctl bootstatus "$SIM_ID" -b || true
            echo "Simulateur iPhone opérationnel !"
          fi

      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y Musly.ipa Payload
          ls -lh Musly.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musly-iOS-IPA
          path: Musly.ipa
          if-no-files-found: error

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
            BUILD="1"
          else
            RAW_VER=$(grep 'version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
            VER=$(echo "$RAW_VER" | cut -d '+' -f 1)
            BUILD=$(echo "$RAW_VER" | cut -d '+' -f 2)
          fi
          echo "musly_version=$VER" >> $GITHUB_OUTPUT
          echo "musly_build=$BUILD" >> $GITHUB_OUTPUT
          echo "Deploying version: $VER, build: $BUILD"

      - name: Deploy IPA to music.corentinjanin.fr
        run: |
          VER="${{ steps.get_version.outputs.musly_version }}"
          BUILD="${{ steps.get_version.outputs.musly_build }}"
          echo "Déploiement de Musly.ipa v${VER}+${BUILD}..."
          curl -f -s -S -X POST "https://music.corentinjanin.fr/api/musly/deploy" \
            -H "X-Musly-Auth: ${{ secrets.X_MUSLY_AUTH }}" \
            -F "file=@Musly.ipa" \
            -F "version=${VER}" \
            -F "build_number=${BUILD}" \
            -F "release_notes=[\"Mise à jour v${VER} Musly iOS (AltSign + MuslyTunnel Reflector)\"]"
